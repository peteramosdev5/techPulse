<!DOCTYPE html>
<html lang="en">
<head>

    <title>Sample Arbitage Site</title>

<body>

    <header>
        <div class="pulse">
        <h1>TechPulse</h1>
        <p>Latest Tech and AI News</p>
        </div>

        <div class="control">
        <div class="filter">
            <button class="button-f" id="homeBut">Home</button>
            <button class="button-f" id="aiBut">AI</button>
            <button class="button-f" id="phoneBut">Phones</button>
            <button class="button-f" id="startBut">StartUps</button>
            <button class="button-f" id="secBut">Security</button>
        </div>
        <div class="region">
            <button class="button-r" id="usaBut">USA</button>
            <button class="button-r" id="ukBut">UK</button>
            <button class="button-r" id="allBut">All</button>
        </div>
        </div>
    </header>

    <input type="text" id="searchNow" placeholder="Search News">

    <section id="newsList"></section>
    <footer>
       <p> <span id="year">&copy; 2026 Arbitrage</span><a href="about.html"> About</a> <span class="bullet"></span> <a href="contact.html">Contact</a> <span></span></p>
       
    </footer>
     </div>
     <script src="arbitrage.js"></script>
    <script src="script.js"></script>
